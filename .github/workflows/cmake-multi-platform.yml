
name: Build & Test

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            build_type: Release
            c_compiler: gcc
            cpp_compiler: g++
            artifact_name: catcat-linux-gcc
            cmake_arch: ""

          - os: ubuntu-latest
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            artifact_name: catcat-linux-clang
            cmake_arch: ""

          - os: macos-14
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            artifact_name: catcat-macos-arm64
            cmake_arch: arm64

          - os: macos-14
            build_type: Release
            c_compiler: clang
            cpp_compiler: clang++
            artifact_name: catcat-macos-x86_64
            cmake_arch: x86_64

    steps:
    - uses: actions/checkout@v4.2.2

    - name: Set build directory path
      id: strings
      shell: bash
      run: echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure (CMake)
      run: |
        EXTRA_ARGS=""
        if [[ "${{ matrix.os }}" == macos-* ]]; then
          EXTRA_ARGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }}"
        fi
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_AUDIO=OFF \
          -DBUILD_TESTS=ON \
          $EXTRA_ARGS \
          -S ${{ github.workspace }}

    - name: Compile
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Upload build artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ steps.strings.outputs.build-output-dir }}/catcat_bundle.zip
        if-no-files-found: error

  create-release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4.2.2

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2.3.2
      with:
        generate_release_notes: true

  build-release:
    name: Build Release (${{ matrix.asset }})
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - os: macos-14
            asset: catcat-macos-arm64.zip
            cmake_arch: arm64
          - os: macos-14
            asset: catcat-macos-x86_64.zip
            cmake_arch: x86_64
          - os: ubuntu-latest
            asset: catcat-linux-x86_64.zip
            cmake_arch: ""
          - os: ubuntu-24.04-arm
            asset: catcat-linux-arm64.zip
            cmake_arch: ""

    steps:
    - uses: actions/checkout@v4.2.2

    - name: Configure (CMake)
      run: |
        EXTRA_ARGS=""
        if [[ "${{ matrix.os }}" == macos-* ]]; then
          EXTRA_ARGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.cmake_arch }}"
        fi
        cmake -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_AUDIO=ON \
          -DBUILD_TESTS=OFF \
          $EXTRA_ARGS \
          -S .

    - name: Build & Package
      run: cmake --build build --target package_catcat

    - name: Upload to release
      run: |
        mv build/catcat_bundle.zip ${{ matrix.asset }}
        gh release upload ${{ github.ref_name }} ${{ matrix.asset }} --clobber
      env:
        GH_TOKEN: ${{ github.token }}

  update-homebrew:
    name: Update Homebrew Tap
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Requires a secret named HOMEBREW_TAP_TOKEN: a GitHub fine-grained PAT with
    # Contents read+write access to DevinMcDonald/homebrew-catcat.
    # Add it at: github.com/DevinMcDonald/catcat/settings/secrets/actions

    steps:
    - uses: actions/checkout@v4.2.2   # catcat repo — for scripts/render_formula.py

    - name: Download all release assets and compute SHA256
      id: assets
      run: |
        VERSION="${{ github.ref_name }}"
        BASE="https://github.com/DevinMcDonald/catcat/releases/download/${VERSION}"
        for name in macos-arm64 macos-x86_64 linux-arm64 linux-x86_64; do
          URL="${BASE}/catcat-${name}.zip"
          curl -fsSL "${URL}" -o "catcat-${name}.zip"
          SHA=$(sha256sum "catcat-${name}.zip" | awk '{print $1}')
          VAR="${name//-/_}"
          echo "sha_${VAR}=${SHA}" >> "$GITHUB_OUTPUT"
          echo "url_${VAR}=${URL}" >> "$GITHUB_OUTPUT"
        done

    - name: Check out homebrew tap
      uses: actions/checkout@v4.2.2
      with:
        repository: DevinMcDonald/homebrew-catcat
        token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        path: tap

    - name: Write formula
      env:
        CATCAT_VERSION:    ${{ github.ref_name }}
        URL_MACOS_ARM64:   ${{ steps.assets.outputs.url_macos_arm64 }}
        SHA_MACOS_ARM64:   ${{ steps.assets.outputs.sha_macos_arm64 }}
        URL_MACOS_X86_64:  ${{ steps.assets.outputs.url_macos_x86_64 }}
        SHA_MACOS_X86_64:  ${{ steps.assets.outputs.sha_macos_x86_64 }}
        URL_LINUX_ARM64:   ${{ steps.assets.outputs.url_linux_arm64 }}
        SHA_LINUX_ARM64:   ${{ steps.assets.outputs.sha_linux_arm64 }}
        URL_LINUX_X86_64:  ${{ steps.assets.outputs.url_linux_x86_64 }}
        SHA_LINUX_X86_64:  ${{ steps.assets.outputs.sha_linux_x86_64 }}
      run: python3 scripts/render_formula.py > tap/Formula/catcat.rb

    - name: Commit and push
      working-directory: tap
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add Formula/catcat.rb
        git commit -m "catcat ${{ github.ref_name }}"
        git push
